<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#F6EEDC" />
    <title>蛙趣蛙趣 · 试玩版</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cellipse cx='32' cy='40' rx='26' ry='20' fill='%239CCB5A' stroke='%234A3B30' stroke-width='3'/%3E%3Ccircle cx='20' cy='20' r='10' fill='%239CCB5A' stroke='%234A3B30' stroke-width='3'/%3E%3Ccircle cx='44' cy='20' r='10' fill='%239CCB5A' stroke='%234A3B30' stroke-width='3'/%3E%3Ccircle cx='20' cy='20' r='4' fill='%234A3B30'/%3E%3Ccircle cx='44' cy='20' r='4' fill='%234A3B30'/%3E%3C/svg%3E" />
    <style>
      html, body {
        margin: 0; height: 100%; overflow: hidden;
        background: #E9DFC6;
        overscroll-behavior: none;
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      body { display: flex; align-items: center; justify-content: center; }
      #game { display: block; touch-action: none; background: #F6EEDC; box-shadow: 0 0 40px rgba(74, 59, 48, 0.18); }
      /* shown while the script itself downloads, before the game can draw its own loading screen */
      #boot {
        position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: #F6EEDC; color: #4A3B30; font: 600 22px/1.4 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }
      #boot .bar { width: 220px; height: 14px; border-radius: 7px; background: #E3D3B3; border: 2px solid #4A3B30; overflow: hidden; }
      #boot .bar i { display: block; width: 40%; height: 100%; background: #E9824E; border-radius: 5px; animation: boot-run 1.1s ease-in-out infinite alternate; }
      #boot small { font-weight: 400; font-size: 15px; color: #7A6A5C; }
      @keyframes boot-run { from { margin-left: 0; } to { margin-left: 60%; } }
      #safe-probe {
        position: fixed; left: 0; top: 0; width: 0; height: 0; visibility: hidden; pointer-events: none;
        padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
      }
    </style>
  </head>
  <body>
    <div id="boot"><div>蛙趣蛙趣 · 加载中…</div><div class="bar"><i></i></div><small>第一次进来要多等一会儿</small></div>
    <canvas id="game"></canvas>
    <div id="safe-probe"></div>
    <script type="module" src="/src/main.web.ts"></script>
  </body>
</html>
