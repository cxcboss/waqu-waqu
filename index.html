  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />

    <title>蛙趣送包裹</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cellipse cx='32' cy='40' rx='26' ry='20' fill='%239CCB5A' stroke='%234A3B30' stroke-width='3'/%3E%3Ccircle cx='20' cy='20' r='10' fill='%239CCB5A' stroke='%234A3B30' stroke-width='3'/%3E%3Ccircle cx='44' cy='20' r='10' fill='%239CCB5A' stroke='%234A3B30' stroke-width='3'/%3E%3Ccircle cx='20' cy='20' r='4' fill='%234A3B30'/%3E%3Ccircle cx='44' cy='20' r='4' fill='%234A3B30'/%3E%3C/svg%3E" />
    <style>
      html, body {
        margin: 0; height: 100%; overflow: hidden;
        background: #E9DFC6;
        overscroll-behavior: none;
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
      #game { display: block; touch-action: none; background: #F6EEDC; box-shadow: 0 0 40px rgba(74, 59, 48, 0.18); }
      #trial-tools {
        box-sizing: border-box; display: flex; flex: none; align-items: center;
        position: relative; z-index: 2; height: calc(42px + env(safe-area-inset-top));
        padding: env(safe-area-inset-top) 10px 0 max(10px, env(safe-area-inset-left));
        background: #f6eedc; border-bottom: 1px solid #d7c8a5;
        color: #4a3b30; font: 600 14px/1.35 system-ui, sans-serif;
      }
      #trial-tools[hidden] { display: none; }
      #trial-settings { position: relative; }
      #settings-trigger {
        box-sizing: border-box; display: flex; align-items: center; gap: 8px; list-style: none;
        min-height: 34px; padding: 4px 11px; border: 1px solid #8b7958;
        background: #f7eedb; border-radius: 18px; box-shadow: 0 1px 3px #4a3b3033;
        touch-action: manipulation; cursor: pointer;
      }
      #settings-trigger::-webkit-details-marker { display: none; }
      #settings-trigger::after {
        content: ""; width: 6px; height: 6px; border-right: 1.5px solid currentColor;
        border-bottom: 1.5px solid currentColor; transform: translateY(-2px) rotate(45deg);
      }
      #trial-settings[open] #settings-trigger::after { transform: translateY(1px) rotate(225deg); }
      #trial-tools[data-autoplay="true"] #settings-trigger { background: #dce8be; border-color: #758c50; }
      .settings-panel {
        box-sizing: border-box; position: absolute; top: calc(100% + 8px); left: 0;
        width: min(292px, calc(100vw - 24px)); padding: 7px 13px; background: #fff8e9;
        border: 1px solid #ab9872; border-radius: 15px; box-shadow: 0 8px 26px #4a3b3040;
      }
      .settings-row {
        min-height: 47px; display: flex; align-items: center; justify-content: space-between;
        gap: 12px; cursor: pointer;
      }
      .settings-row + .settings-row { border-top: 1px solid #e3d5b8; }
      .settings-switch {
        appearance: none; position: relative; flex: none; box-sizing: border-box;
        width: 42px; height: 24px; margin: 0; border: 1px solid #a49271; border-radius: 14px;
        background: #e8dfce; cursor: pointer;
      }
      .settings-switch::before {
        content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px;
        border-radius: 50%; background: #fffaf0; box-shadow: 0 1px 2px #49381845;
      }
      .settings-switch:checked { background: #658140; border-color: #576e38; }
      .settings-switch:checked::before { left: 20px; }
      .settings-switch:disabled { opacity: .55; }
      .settings-choices {
        display: flex; gap: 2px; padding: 2px; background: #ede2cb; border-radius: 10px;
      }
      .settings-row > span { white-space: nowrap; }
      .settings-choices label { position: relative; cursor: pointer; }
      .settings-choices input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
      .settings-choices span { display: block; min-width: 28px; padding: 5px 4px; text-align: center; white-space: nowrap; border-radius: 8px; }
      .settings-choices input:checked + span { background: #fffaf0; color: #374c23; box-shadow: 0 1px 3px #4a3b3033; }
      .settings-choices input:focus-visible + span, .settings-switch:focus-visible, #settings-trigger:focus-visible {
        outline: 2px solid #566e37; outline-offset: 2px;
      }
      /* shown while the script itself downloads, before the game can draw its own loading screen */
      #boot {
        position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: #F6EEDC; color: #4A3B30; font: 600 22px/1.4 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }
      #boot .bar { width: 220px; height: 14px; border-radius: 7px; background: #E3D3B3; border: 2px solid #4A3B30; overflow: hidden; }
      #boot .bar i { display: block; width: 40%; height: 100%; background: #E9824E; border-radius: 5px; animation: boot-run 1.1s ease-in-out infinite alternate; }
      #boot small { font-weight: 400; font-size: 15px; color: #7A6A5C; }
      @keyframes boot-run { from { margin-left: 0; } to { margin-left: 60%; } }
      #safe-probe {
        position: fixed; left: 0; top: 0; width: 0; height: 0; visibility: hidden; pointer-events: none;
        padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
      }
    </style>
    <script type="module" crossorigin src="./assets/index-Bkj85ZzQ.js"></script>
  </head>
  <body>
    <div id="boot"><div>蛙趣蛙趣 · 加载中…</div><div class="bar"><i></i></div><small>第一次进来要多等一会儿</small></div>
    <div id="trial-tools" hidden>
      <details id="trial-settings">
        <summary id="settings-trigger">设置</summary>
        <div class="settings-panel">
          <label class="settings-row">自动玩<input class="settings-switch" id="autoplay" type="checkbox" role="switch" disabled /></label>
          <div class="settings-row">
            <span id="autoplay-speed-label">速度</span>
            <div class="settings-choices" role="radiogroup" aria-labelledby="autoplay-speed-label">
              <label><input name="autoplay-speed" type="radio" value="slowest" /><span>最慢</span></label>
              <label><input name="autoplay-speed" type="radio" value="slow" /><span>慢</span></label>
              <label><input name="autoplay-speed" type="radio" value="normal" checked /><span>中</span></label>
              <label><input name="autoplay-speed" type="radio" value="fast" /><span>快</span></label>
              <label><input name="autoplay-speed" type="radio" value="fastest" /><span>最快</span></label>
            </div>
          </div>
          <div class="settings-row">
            <span id="autoplay-error-label">错误率</span>
            <div class="settings-choices" role="radiogroup" aria-labelledby="autoplay-error-label">
              <label><input name="autoplay-error" type="radio" value="none" checked /><span>0 错误</span></label>
              <label><input name="autoplay-error" type="radio" value="low" /><span>少错误</span></label>
              <label><input name="autoplay-error" type="radio" value="high" /><span>多错误</span></label>
            </div>
          </div>
        </div>
      </details>
    </div>
    <canvas id="game"></canvas>
    <div id="safe-probe"></div>
  </body>
</html>
